name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SECRET_KEY: ci-secret-key-para-testes
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  DATABASE_URL: sqlite:///./banco.db
  POSTGRES_PASSWORD: ci-postgres-password

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

  test:
    name: Testes (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Testes com cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 tests/

      - name: Upload do relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar docker-compose
        run: docker compose config > /dev/null

      - name: Build da imagem
        run: docker build --file dockerfile --tag projetoapi:ci .

      - name: Smoke test da API
        run: |
          docker run -d --name api-ci -p 8001:8001 \
            -e SECRET_KEY="$SECRET_KEY" \
            -e ALGORITHM="$ALGORITHM" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES="$ACCESS_TOKEN_EXPIRE_MINUTES" \
            -e DATABASE_URL=sqlite:////app/banco.db \
            projetoapi:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/openapi.json > /dev/null; then
              echo "API respondendo em /openapi.json"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api-ci)" != "true" ]; then
              echo "Container parou antes de ficar pronto:"
              docker logs api-ci
              exit 1
            fi
            sleep 2
          done

          echo "Timeout aguardando a API:"
          docker logs api-ci
          exit 1

      - name: Limpar containers
        if: always()
        run: docker rm -f api-ci 2>/dev/null || true
