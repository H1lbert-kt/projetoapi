line-length = 100
target-version = "py311"

extend-exclude = [
    "venv",
    ".venv",
    "alembic/versions",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Depends() nos defaults é o padrão do FastAPI
]
