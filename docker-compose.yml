services:
  db:
    image: postgres:15-alpine
    container_name: barbearia_db
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=barbearia
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: api_barbearia
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@db:5432/barbearia
    depends_on:
      - db

volumes:
  postgres_data: